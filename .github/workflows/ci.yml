# Commit-phase CI for PRs — a signing-free simulator build that gates every change.
#
# The existing testflight.yml `build` runs only on push to main (it signs + uploads to
# TestFlight), so it never gated PRs. This job compiles the app on a PR with no secrets
# (CODE_SIGNING_ALLOWED=NO), posting a `build` status check that branch protection requires.
# It runs on pull_request ONLY, so it never collides with testflight's push-time `build`.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found, trying latest available"
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme PricingStudio \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm

      - name: Build (simulator, no signing)
        run: |
          set -o pipefail
          # -skipPackagePluginValidation: SwiftPM build plugins must be explicitly
          # trusted, and Xcode asks interactively the first time. CI has nobody to
          # ask, so an otherwise-fine dependency that ships a plugin fails at
          # "Validate plug-in ... in package" before a line is compiled — which is
          # how secp256k1.swift 0.23.2 (new SharedSourcesPlugin) reddened the build.
          # We already vet which dependencies enter Package.swift; this says we
          # accept the plugins that come with the packages we chose, rather than
          # pinning below every release that adds one.
          xcodebuild build \
            -scheme PricingStudio \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  # Host-free unit tests: pure logic lives in the PricingStudioCore local Swift
  # package, so `swift test` runs it with no app host and no simulator (the app
  # can't boot headless as a test host — that's why the hosted PricingStudioTests
  # only compile). A logic change whose test fails is caught HERE, not merely
  # compiled. See issue #88.
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: PricingStudioCore unit tests (host-free)
        run: swift test --package-path LocalPackages/PricingStudioCore
