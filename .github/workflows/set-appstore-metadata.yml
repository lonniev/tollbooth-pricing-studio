name: Set App Store Metadata

# Fill the App Store listing's text metadata (category, subtitle, privacy
# URL, description, keywords, support URL, version + build) via the App
# Store Connect API, reusing the release pipeline's key secrets.
on:
  workflow_dispatch:
    inputs:
      category:
        description: "Primary category id (e.g. BUSINESS)"
        required: false
        default: "BUSINESS"
      version_string:
        description: "Marketing version to set on the store version"
        required: false
        default: "1.10.0"
      privacy_url:
        description: "Privacy policy URL"
        required: false
        default: "https://tollbooth-dpyc.com/pricing-studio/privacy"
      support_url:
        description: "Support URL"
        required: false
        default: "https://tollbooth-dpyc.com/pricing-studio/support"
      marketing_url:
        description: "Marketing URL (optional)"
        required: false
        default: "https://tollbooth-dpyc.com/pricing-studio/"
      bundle_id:
        description: "App bundle id"
        required: false
        default: "com.tollbooth.dpyc.PricingStudio"
      whats_new:
        description: "Release notes. Blank = read appstore/whats-new.md. Pass 'NONE' for a first release (whatsNew is rejected when there is no prior version)."
        required: false
        default: ""
      copyright:
        description: "Copyright line (REQUIRED by ASC; the UI fills it silently)"
        required: false
        default: "2026 Lonnie VanZandt"
      require_build:
        description: "Build NUMBER (CFBundleVersion) that must be attached, e.g. 265. Blank = newest VALID, which right after an upload is usually the PREVIOUS build."
        required: false
        default: ""
      wait_minutes:
        description: "Minutes to wait for require_build to finish processing"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  set-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install --quiet pyjwt cryptography
      - name: Set metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          # Via env, not ${{ }} interpolation — release notes are free text and
          # would otherwise be pasted straight into the shell.
          WHATS_NEW_IN: ${{ inputs.whats_new }}
          COPYRIGHT_IN: ${{ inputs.copyright }}
        run: |
          set -eo pipefail
          ASC_PRIVATE_KEY="$(echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode)"
          export ASC_PRIVATE_KEY

          # Blank input → the version-controlled copy. 'NONE' → omit entirely,
          # which is what a FIRST release needs (whatsNew has no prior version
          # to describe changes from and the whole PATCH fails if it is sent).
          if [ "$WHATS_NEW_IN" = "NONE" ]; then
            WHATS_NEW=""
          elif [ -n "$WHATS_NEW_IN" ]; then
            WHATS_NEW="$WHATS_NEW_IN"
          elif [ -f appstore/whats-new.md ]; then
            WHATS_NEW="$(cat appstore/whats-new.md)"
          else
            echo "::error::No --whats-new given and appstore/whats-new.md is missing."
            exit 1
          fi
          echo "What's New (${#WHATS_NEW} chars):"
          echo "$WHATS_NEW"

          python scripts/set_appstore_metadata.py \
            --bundle-id "${{ inputs.bundle_id }}" \
            --category "${{ inputs.category }}" \
            --version-string "${{ inputs.version_string }}" \
            --privacy-url "${{ inputs.privacy_url }}" \
            --support-url "${{ inputs.support_url }}" \
            --marketing-url "${{ inputs.marketing_url }}" \
            --copyright "$COPYRIGHT_IN" \
            --require-build "${{ inputs.require_build }}" \
            --wait-minutes "${{ inputs.wait_minutes }}" \
            --whats-new "$WHATS_NEW"
