# ── Release stage: TestFlight (PRE-PRODUCTION) ───────────────────────────────
# A merge to `main` builds, signs, and uploads to TestFlight — Apple's
# pre-production beta channel reaching only invited testers. It does NOT publish
# to the public App Store; a separate, human-triggered workflow (submit-app-review)
# promotes an already-tested build to App Store review.
#
# Implication for the DPYC Agentic Service Desk (QA + Journeyman) and human
# reviewers: because a merge reaches only pre-production testers, it is acceptable
# to merge a compile-clean, QA-passed change and DEFER real-world verification to
# the human who has the physical gear (a paired Apple Watch, a device). That
# on-device check is the intended post-merge gate here — not a merge blocker.
# This is also why the PR gate (ci.yml) is a signing-free COMPILE gate: the app
# cannot boot headless as a simulator test host, so behavior is verified
# on-device via TestFlight rather than executed in CI.
name: Build, Archive, and Distribute

on:
  push:
    branches: [main]
    # Non-app changes (CI tooling, ASC scripts, store screenshots, docs) must
    # not burn a TestFlight upload — only source/project/asset changes rebuild.
    paths-ignore:
      - ".github/**"
      - "scripts/**"
      - "appstore/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found, trying latest available"
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme PricingStudio \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" $KEYCHAIN_PATH

      - name: Install provisioning profile
        # Fetched fresh from the App Store Connect API by name so a
        # capability change (run the provision-push workflow) takes effect
        # on the next build — no PROVISIONING_PROFILE_BASE64 secret rotation.
        id: profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -eo pipefail
          pip3 install --quiet --break-system-packages pyjwt cryptography \
            || pip3 install --quiet pyjwt cryptography
          ASC_PRIVATE_KEY="$(echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode)"
          export ASC_PRIVATE_KEY
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          python3 scripts/fetch_profile.py --out "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
            <<< $(security cms -D -i $PP_PATH))
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin \
            <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
          echo "uuid=$PP_UUID" >> $GITHUB_OUTPUT
          echo "name=$PP_NAME" >> $GITHUB_OUTPUT

      - name: Compute version
        id: ver
        run: |
          # Marketing version is read from project.pbxproj as-is. Every
          # CI build of the same MARKETING_VERSION appears in TestFlight
          # as a build of one version, with CFBundleVersion =
          # github.run_number giving each build a unique number. The
          # latest build is automatically the "current" installable —
          # no Previous Builds confusion.
          BASE=$(grep -E '^\s+MARKETING_VERSION = [0-9]' PricingStudio.xcodeproj/project.pbxproj \
            | grep -v '1.0' | head -1 | sed 's/.*= //' | tr -d ';[:space:]')
          echo "marketing=${BASE}" >> $GITHUB_OUTPUT
          echo "Marketing version: ${BASE} (build ${{ github.run_number }})"

      - name: Build and archive
        run: |
          # Sign AT ARCHIVE TIME. Entitlements (aps-environment, iCloud
          # containers) are baked into the binary during signing — an
          # unsigned archive has none, and exportArchive does NOT
          # resurrect them from the profile: every build archived with
          # CODE_SIGNING_ALLOWED=NO shipped entitlement-bare (SwiftData
          # silently fell back to local-only; InboxSignal's CKContainer
          # crashed at launch — how this was caught).
          xcodebuild archive \
            -scheme PricingStudio \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/PricingStudio.xcarchive \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm \
            MARKETING_VERSION=${{ steps.ver.outputs.marketing }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PricingStudio.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions-appstore.plist

      - name: Extract version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c \
            "Print CFBundleShortVersionString" \
            $RUNNER_TEMP/PricingStudio.xcarchive/Products/Applications/PricingStudio.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c \
            "Print CFBundleVersion" \
            $RUNNER_TEMP/PricingStudio.xcarchive/Products/Applications/PricingStudio.app/Info.plist)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Attach IPA to GitHub Release
        # v3 (Node 24 runtime) regressed under our workflow — every push to
        # main after 2026-05-23 failed at this step with "HttpError: Bad
        # credentials" despite the auto-provisioned GITHUB_TOKEN and
        # `contents: write` permissions. v2 has worked for 100+ builds.
        # Re-evaluate v3 before the 2026-06-02 Node 20 deprecation cutover.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          name: "Pricing Studio v${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            Automated build from `${{ github.sha }}`.

            **Version:** ${{ steps.version.outputs.version }}
            **Build:** ${{ steps.version.outputs.build }}
          files: ${{ runner.temp }}/export/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        run: |
          set -eo pipefail
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa)"

          # altool prints "ERROR:" to stdout but can still EXIT 0 — notably the
          # "Failed to determine the Apple ID from Bundle ID" lookup failure
          # (pending agreement / lapsed membership / transient ASC API). A bare
          # exit-code check therefore lets a non-delivery pass as green, and the
          # missing build only surfaces later in TestFlight. Gate on BOTH the
          # exit code AND the absence of altool's error markers, and retry a few
          # times to ride out transient App Store Connect hiccups.
          attempts=3
          delay=30
          for n in $(seq 1 "$attempts"); do
            echo "::group::altool upload attempt $n/$attempts"
            set +e
            out="$(xcrun altool --upload-app \
              --type ios \
              --file "$IPA" \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" 2>&1)"
            code=$?
            set -e
            printf '%s\n' "$out"
            echo "::endgroup::"

            # Success = altool exited 0 AND emitted none of its error markers.
            # (We deliberately do not require a specific success string, whose
            # wording changes across Xcode versions and could false-fail.)
            if [ "$code" -eq 0 ] \
               && ! printf '%s' "$out" | grep -qiE 'ERROR:|Failed to determine the Apple ID|product-errors'; then
              echo "✅ Build delivered to App Store Connect."
              exit 0
            fi

            echo "::warning::altool upload attempt $n did NOT deliver (exit=$code) — see log above."
            [ "$n" -lt "$attempts" ] && { echo "Retrying in ${delay}s…"; sleep "$delay"; }
          done

          echo "::error::altool failed to deliver the build to App Store Connect after ${attempts} attempts."
          echo "::error::Most common cause of 'Failed to determine the Apple ID from Bundle ID': a pending agreement (App Store Connect → Business — visible to the Account Holder only) or a lapsed Apple Developer Program membership."
          exit 1

      - name: Clean up secrets
        if: always()
        run: |
          rm -f $RUNNER_TEMP/cert.p12
          rm -f $RUNNER_TEMP/profile.mobileprovision
          rm -f $RUNNER_TEMP/AuthKey_*.p8
          security delete-keychain $RUNNER_TEMP/build.keychain 2>/dev/null || true
