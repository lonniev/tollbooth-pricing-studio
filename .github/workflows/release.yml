name: Build, Archive, and Distribute

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 16.x found, using default"
            xcodebuild -version
          else
            sudo xcode-select -s "$XCODE_PATH"
            xcodebuild -version
          fi

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme PricingStudio \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROFILE_BASE64" | base64 --decode > $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
            <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

      - name: Build and archive
        run: |
          xcodebuild archive \
            -scheme PricingStudio \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/PricingStudio.xcarchive \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PricingStudio.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions-appstore.plist

      - name: Extract version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c \
            "Print CFBundleShortVersionString" \
            $RUNNER_TEMP/PricingStudio.xcarchive/Products/Applications/PricingStudio.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c \
            "Print CFBundleVersion" \
            $RUNNER_TEMP/PricingStudio.xcarchive/Products/Applications/PricingStudio.app/Info.plist)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          name: "Pricing Studio v${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            Automated build from `${{ github.sha }}`.

            **Version:** ${{ steps.version.outputs.version }}
            **Build:** ${{ steps.version.outputs.build }}
          files: ${{ runner.temp }}/export/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        run: |
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode \
            > $RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8
          xcrun notarytool submit --help > /dev/null 2>&1 || true
          xcrun altool --upload-app \
            --type ios \
            --file "$(ls $RUNNER_TEMP/export/*.ipa)" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up secrets
        if: always()
        run: |
          rm -f $RUNNER_TEMP/cert.p12
          rm -f $RUNNER_TEMP/profile.mobileprovision
          rm -f $RUNNER_TEMP/AuthKey_*.p8
          security delete-keychain $RUNNER_TEMP/build.keychain 2>/dev/null || true
