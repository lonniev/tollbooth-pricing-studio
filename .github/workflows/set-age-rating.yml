name: Set Age Rating

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "App bundle id"
        required: false
        default: "com.tollbooth.dpyc.PricingStudio"

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install --quiet pyjwt cryptography
      - name: Set age rating
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -eo pipefail
          ASC_PRIVATE_KEY="$(echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode)"
          export ASC_PRIVATE_KEY
          python scripts/set_age_rating.py --bundle-id "${{ inputs.bundle_id }}"
